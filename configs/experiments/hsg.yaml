# sample style training script
dataset_path: './data/msg'
device: 0
pp_threshold: 0.3
object_threshold: 0.2

# coefficients for multitasking loss
loss_params:
  pr: 0.5
  obj: 0.5
  tcr: 0.0
  mean: 0.0
  entail: 1.0

eval_split: Test
train_split: Training
# for train
output_dir: './exp-results/aomsg'
output_file: 'train'
wandb: True

# if resume training from a chkpt
resume: False
resume_path: './path/to/checkpoints/0+.pth' # EXAMPLE: './exp-results/aomsg/2025-03-04_00-05-14/checkpoints/29-step22470+.pth'
# for eval
eval_output_dir: './exp-results/aomsg/2025-03-04_00-05-14' # this is specific to trained checkpoints
eval_chkpt: 28-step21721+.pth #null for no checkpoint
save_every: False # if save specific results for every video
eval_step: 100 # this is evaluation frequency during training
enable_eval: True

learning_rate: 0.00002 # 8e-5
num_epochs: 1
warmup_epochs: 3
warmup: no # cos

# optimizer settings (using set_weight_decay_per_param from optim.py)
weight_decay: 0.01  # weight decay for regular parameters
gain_bias_decay: 0.01  # weight decay for normalization layers and bias (default: same as weight_decay)
exclude_weight_decay: ["logit_scale", "pr_logit_scale", "object_alpha", "place_alpha", "curv"]  # parameters to exclude from weight decay
use_linear_warmup_cosine: True  # if True, use LinearWarmupCosineDecayLR instead of get_schedule_with_warmup

num_workers: 8
train_bs: 32
bs_video: 2
eval_bs: 64 # debug test

log_every: 1
chkpt_every: 3000

obj_embedder:
  model: "dinov2-base" #"dinov2-small", "convnext-tiny-224", #'resnet50', # "dinov2_vits14", "dinov2_vitb14", "dinov2_vitl14", "dinov2_vitg14"
  weights: DEFAULT
  freeze: True
  output_type: feature # doesn't matter if embedding is cropped from image features BUT matters for sepMSG

place_embedder:
  model: "dinov2-base" #"convnext-tiny", #'resnet50', # "dinov2-base", "dinov2_vitb14", "dinov2_vitl14", "dinov2_vitg14"
  weights: DEFAULT
  freeze: True
  output_type: feature # mean, cls, feature

associator:
  model: "AoMSG-S-4" # "AoMSG-S-2"
  object_dim: 768 # FYI resnet18=512, dinov2-small=384, dinov2-base=768
  place_dim: 768
  output_dim: 1024
  curv_init: 40.0  # initial curvature for hyperbolic space


# loss terms
pr_loss: infonce
obj_loss: infonce
pos_weight: 10
pp_weight: 1
temperature: 0.1  # temperature for InfoNCELoss